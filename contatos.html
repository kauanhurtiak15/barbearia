<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <header> 
        <div class="caixa">
            <h1><img src="logo.png"></h1>

            <nav>
                <ul>
                    <li><a href=" index.html "> Home </a></li>
                    <li><a href=" contato.html "> Contato </a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <form>
            <h1> Fale Conosco </h1>
            <fieldset>
                <p> Nome e Sobrenome </p>
                <input type="text" class="input-texto" required>

                <p> E-mail </p>
                <input type="email" class="input-texto" required placeholder="seulogin@dominio.com">

                <p> Telefone </p>
                <input type="tel" class="input-texto" required placeholder="(xx) xxxxx-xxxx">

                <p> Mensagem </p>
                <textarea cols="70" rows="10" required></textarea>
            </fieldset>
        </form>
    </main>

    <footer>
        <img src="logo-branco.png">
        <p class="copyright">&copy; Copyright Barbearia Alura - 2019</p>
    </footer>
</body>
</html>
